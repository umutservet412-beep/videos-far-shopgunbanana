<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎮 200+ Oyun Başlatıcı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d1a;
            color: #fff;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #0f0f1f, #1a0a2e);
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e94560;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            color: #e94560;
        }

        .header .badge {
            background: #e94560;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .header input {
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            background: #1e1e3a;
            color: #fff;
            width: 280px;
            font-size: 14px;
            outline: 2px solid transparent;
            transition: 0.3s;
        }

        .header input:focus {
            outline: 2px solid #e94560;
        }

        .header input::placeholder {
            color: #666;
        }

        .header .count {
            color: #888;
            font-size: 14px;
        }

        /* KATEGORİLER */
        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 30px;
            background: #0d0d1a;
            border-bottom: 1px solid #1a1a2e;
            flex-wrap: wrap;
            position: sticky;
            top: 72px;
            z-index: 99;
            backdrop-filter: blur(10px);
        }

        .categories button {
            padding: 7px 20px;
            border: none;
            border-radius: 20px;
            background: #1a1a2e;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
        }

        .categories button:hover {
            background: #2a2a4a;
            color: #fff;
        }

        .categories button.active {
            background: #e94560;
            color: #fff;
        }

        /* TLAUNCHER KARTI */
        .tlauncher-card {
            margin: 20px 30px 15px 30px;
            background: linear-gradient(135deg, #0f1a3e, #1a0a2e);
            border-radius: 16px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #e94560;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.15);
            flex-wrap: wrap;
            gap: 15px;
        }

        .tlauncher-card .info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tlauncher-card .icon {
            font-size: 44px;
            background: #e94560;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .tlauncher-card .text h2 {
            font-size: 22px;
        }

        .tlauncher-card .text p {
            color: #aaa;
            font-size: 14px;
        }

        .tlauncher-card .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tlauncher-card .actions button {
            padding: 10px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-launch {
            background: #e94560;
            color: #fff;
        }
        .btn-launch:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        .btn-website {
            background: #1a1a2e;
            color: #fff;
        }
        .btn-website:hover {
            background: #2a2a4a;
        }

        /* IFRAME KONTEYNER */
        .iframe-container {
            margin: 0 30px 20px 30px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #1a1a2e;
            background: #000;
            display: none;
            height: 600px;
        }

        .iframe-container.show {
            display: block;
        }

        .iframe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #0a0a18;
            border-bottom: 1px solid #1a1a2e;
        }

        .iframe-header span {
            color: #6af;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .iframe-header button {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 4px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .iframe-header button:hover {
            background: #ff6b81;
        }

        .iframe-container iframe {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }

        /* OYUN GRİDİ */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 10px 30px 40px 30px;
        }

        .game-card {
            background: #15152a;
            border-radius: 14px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            position: relative;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #e94560;
            background: #1e1e3a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .game-card .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .game-card .name {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
        }

        .game-card .tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 10px;
            background: #1a1a2e;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-card .play-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 12px;
            background: #e94560;
            padding: 2px 10px;
            border-radius: 10px;
            color: #fff;
            opacity: 0;
            transition: 0.3s;
        }

        .game-card:hover .play-btn {
            opacity: 1;
        }

        /* DURUM */
        .status {
            text-align: center;
            padding: 10px;
            color: #555;
            font-size: 14px;
            border-top: 1px solid #1a1a2e;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .header input {
                width: 100%;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                padding: 10px 15px 30px 15px;
            }
            .tlauncher-card {
                margin: 15px;
                padding: 18px;
            }
            .iframe-container {
                margin: 0 15px 15px 15px;
                height: 400px;
            }
            .categories {
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🎮 <span>T</span>Launcher <span class="badge">200+</span></h1>
        <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
            <input type="text" id="searchInput" placeholder="🔍 Oyun ara..." oninput="filterGames()" />
            <span class="count" id="gameCount">200 oyun</span>
        </div>
    </div>

    <!-- KATEGORİLER -->
    <div class="categories" id="categoryContainer">
        <button class="active" data-cat="all">📋 Tümü</button>
        <button data-cat="action">⚔️ Aksiyon</button>
        <button data-cat="adventure">🗺️ Macera</button>
        <button data-cat="rpg">🧙 RPG</button>
        <button data-cat="shooter">🔫 Nişancı</button>
        <button data-cat="sports">⚽ Spor</button>
        <button data-cat="strategy">🧠 Strateji</button>
        <button data-cat="racing">🏎️ Yarış</button>
        <button data-cat="puzzle">🧩 Bulmaca</button>
        <button data-cat="horror">👻 Korku</button>
        <button data-cat="simulation">🔄 Simülasyon</button>
        <button data-cat="arcade">🕹️ Arcade</button>
        <button data-cat="minecraft">⛏️ Minecraft</button>
    </div>

    <!-- TLAUNCHER KARTI -->
    <div class="tlauncher-card">
        <div class="info">
            <div class="icon">⛏️</div>
            <div class="text">
                <h2>TLauncher</h2>
                <p>Minecraft için en popüler başlatıcı</p>
                <p style="font-size:12px; color:#6af;">tlauncher.org</p>
            </div>
        </div>
        <div class="actions">
            <button class="btn-launch" onclick="openTLauncher()">▶ TLauncher'ı Aç</button>
            <button class="btn-website" onclick="window.open('https://tlauncher.org','_blank')">🌐 Web'e Git</button>
        </div>
    </div>

    <!-- IFRAME -->
    <div class="iframe-container" id="iframeContainer">
        <div class="iframe-header">
            <span>⛏️ <span id="iframeTitle">TLauncher.org</span></span>
            <button onclick="closeIframe()">✕ Kapat</button>
        </div>
        <iframe id="gameIframe" src=""></iframe>
    </div>

    <!-- OYUN GRİDİ -->
    <div class="game-grid" id="gameGrid"></div>

    <!-- DURUM -->
    <div class="status" id="status">✅ 200+ oyun yüklendi - TLauncher ile oyun keyfi!</div>

    <script>
        // ================================================================
        //  200+ OYUN VERİSİ
        // ================================================================
        function generateGames() {
            const categories = ['action', 'adventure', 'rpg', 'shooter', 'sports', 'strategy', 'racing', 'puzzle', 'horror', 'simulation', 'arcade', 'minecraft'];
            const categoryEmojis = {
                action: '⚔️',
                adventure: '🗺️',
                rpg: '🧙',
                shooter: '🔫',
                sports: '⚽',
                strategy: '🧠',
                racing: '🏎️',
                puzzle: '🧩',
                horror: '👻',
                simulation: '🔄',
                arcade: '🕹️',
                minecraft: '⛏️'
            };

            const gameNames = {
                action: ['DOOM', 'God of War', 'Devil May Cry', 'Bayonetta', 'Ninja Gaiden', 'Metal Gear Solid', 'Resident Evil', 'Castlevania', 'Darksiders', 'Ryse', 'Asura\'s Wrath', 'Vanquish', 'Bulletstorm', 'Shadow Warrior', 'F.E.A.R.', 'Crysis', 'Far Cry', 'Call of Duty', 'Battlefield', 'Medal of Honor'],
                adventure: ['Zelda', 'Uncharted', 'Tomb Raider', 'Assassin\'s Creed', 'Prince of Persia', 'Beyond Good & Evil', 'Jak & Daxter', 'Ratchet & Clank', 'Sly Cooper', 'Psychonauts', 'Grim Fandango', 'Monkey Island', 'Day of the Tentacle', 'Full Throttle', 'Broken Sword', 'Syberia', 'The Longest Journey', 'Dreamfall', 'Life is Strange', 'Telltale Games'],
                rpg: ['Final Fantasy', 'Dragon Quest', 'Elder Scrolls', 'Fallout', 'Mass Effect', 'Dragon Age', 'The Witcher', 'Kingdom Hearts', 'Persona', 'Shin Megami Tensei', 'Baldur\'s Gate', 'Neverwinter Nights', 'Planescape Torment', 'Icewind Dale', 'Diablo', 'Path of Exile', 'Grim Dawn', 'Titan Quest', 'Divinity', 'Pillars of Eternity'],
                shooter: ['Counter-Strike', 'Valorant', 'Overwatch', 'Apex Legends', 'Fortnite', 'PUBG', 'Call of Duty', 'Battlefield', 'Halo', 'Gears of War', 'Quake', 'Unreal Tournament', 'Doom', 'Wolfenstein', 'Borderlands', 'Destiny', 'The Division', 'Rainbow Six', 'Splatoon', 'Team Fortress'],
                sports: ['FIFA', 'PES', 'Madden NFL', 'NBA 2K', 'NHL', 'F1', 'Gran Turismo', 'Forza', 'Rocket League', 'Tony Hawk', 'SSX', 'Wii Sports', 'Mario Tennis', 'Mario Golf', 'Pro Evolution Soccer', 'Football Manager', 'WWE 2K', 'UFC', 'EA Sports UFC', 'Top Spin'],
                strategy: ['Civilization', 'Age of Empires', 'StarCraft', 'Warcraft', 'Command & Conquer', 'Total War', 'XCOM', 'Fire Emblem', 'Advance Wars', 'Pikmin', 'Sid Meier\'s', 'Crusader Kings', 'Europa Universalis', 'Hearts of Iron', 'Victoria', 'Stellaris', 'Endless Legend', 'Age of Wonders', 'Battle for Wesnoth', 'Company of Heroes'],
                racing: ['Need for Speed', 'Forza Horizon', 'Gran Turismo', 'Mario Kart', 'Burnout', 'Midnight Club', 'The Crew', 'Project CARS', 'Assetto Corsa', 'Racing', 'TrackMania', 'Dirt', 'WRC', 'F1', 'NASCAR', 'Ridge Racer', 'Daytona USA', 'OutRun', 'Initial D', 'Wipeout'],
                puzzle: ['Tetris', 'Portal', 'The Witness', 'Baba Is You', 'Monument Valley', 'Cut the Rope', 'Angry Birds', 'Bejeweled', 'Candy Crush', 'Plants vs Zombies', 'Peggle', 'Zuma', 'Luxor', 'Puzzle Bobble', 'Dr. Mario', 'Puyo Puyo', 'Tetris Effect', 'Lumines', 'Picross', 'Sudoku'],
                horror: ['Silent Hill', 'Resident Evil', 'Amnesia', 'Outlast', 'Fatal Frame', 'Dead Space', 'Alien Isolation', 'SOMA', 'Penumbra', 'The Evil Within', 'Until Dawn', 'Dying Light', 'Left 4 Dead', 'Dead Rising', 'Zombie', 'The Last of Us', 'Days Gone', 'State of Decay', 'World War Z', 'Back 4 Blood'],
                simulation: ['The Sims', 'SimCity', 'RollerCoaster Tycoon', 'Planet Coaster', 'City Skylines', 'Farming Simulator', 'Euro Truck Simulator', 'Flight Simulator', 'Train Simulator', 'Spore', 'Black & White', 'Populous', 'The Movies', 'SimEarth', 'SimLife', 'Theme Park', 'Zoo Tycoon', 'Jurassic World Evolution', 'Two Point Hospital', 'Prison Architect'],
                arcade: ['Pac-Man', 'Space Invaders', 'Galaga', 'Donkey Kong', 'Street Fighter', 'Mortal Kombat', 'Tekken', 'Soulcalibur', 'Killer Instinct', 'Dance Dance Revolution', 'Guitar Hero', 'Rock Band', 'Beat Saber', 'Pong', 'Asteroids', 'Centipede', 'Frogger', 'Q*bert', 'Dig Dug', 'Missile Command'],
                minecraft: ['TLauncher', 'Minecraft', 'Minecraft Dungeons', 'Minecraft Legends', 'Hypixel', 'SkyBlock', 'BedWars', 'SkyWars', 'Survival Games', 'Hunger Games', 'UHC', 'Crafting', 'Redstone', 'Adventure Maps', 'Parkour', 'PvP', 'KitPvP', 'Factions', 'Prison', 'SkyFactory']
            };

            const games = [];
            let id = 0;

            for (const category of categories) {
                const names = gameNames[category] || [`${category} Oyun`];
                const emoji = categoryEmojis[category] || '🎮';

                // Her kategoriden en az 15 oyun ekle
                for (let i = 0; i < Math.max(15, names.length); i++) {
                    const name = names[i % names.length];
                    const uniqueName = i >= names.length ? `${name} ${Math.floor(i / names.length) + 2}` : name;

                    // Oyun URL'leri (oyun siteleri)
                    let url;
                    const gameSlug = uniqueName.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (category === 'minecraft' || uniqueName.includes('TLauncher')) {
                        url = 'https://tlauncher.org';
                    } else if (uniqueName.includes('Steam')) {
                        url = 'https://store.steampowered.com';
                    } else if (uniqueName.includes('Epic')) {
                        url = 'https://epicgames.com';
                    } else {
                        // Genel oyun siteleri
                        const sites = [
                            'https://poki.com',
                            'https://crazygames.com',
                            'https://plays.org',
                            'https://gamepix.com',
                            'https://y8.com',
                            'https://miniclip.com',
                            'https://addictinggames.com',
                            'https://kongregate.com',
                            'https://newgrounds.com',
                            'https://armorgames.com'
                        ];
                        url = sites[id % sites.length];
                    }

                    games.push({
                        id: id++,
                        name: uniqueName,
                        emoji: emoji,
                        category: category,
                        url: url
                    });
                }
            }

            // Toplam 200+ oyun olacak şekilde kes
            return games.slice(0, 210);
        }

        // ================================================================
        //  BAŞLAT
        // ================================================================
        const allGames = generateGames();
        let currentCategory = 'all';
        let currentSearch = '';
        let currentGames = [...allGames];

        function renderGames() {
            const grid = document.getElementById('gameGrid');

            const filtered = allGames.filter(game => {
                const matchCat = currentCategory === 'all' || game.category === currentCategory;
                const matchSearch = game.name.toLowerCase().includes(currentSearch.toLowerCase());
                return matchCat && matchSearch;
            });

            currentGames = filtered;

            document.getElementById('gameCount').textContent = `${filtered.length} oyun`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:80px 20px; color:#555; font-size:20px;">
                        😕 Oyun bulunamadı<br>
                        <span style="font-size:14px; color:#444;">Farklı bir kategori veya kelime deneyin</span>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(game => `
                <div class="game-card" onclick="playGame('${game.url}', '${game.name}')">
                    <span class="play-btn">▶ Oyna</span>
                    <span class="emoji">${game.emoji}</span>
                    <div class="name">${game.name}</div>
                    <span class="tag">${game.category}</span>
                </div>
            `).join('');
        }

        // ================================================================
        //  OYUN OYNAT
        // ================================================================
        function playGame(url, name) {
            const container = document.getElementById('iframeContainer');
            const iframe = document.getElementById('gameIframe');
            const title = document.getElementById('iframeTitle');

            container.classList.add('show');
            title.textContent = name || 'Oyun';

            // URL'yi güvenli hale getir
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }

            iframe.src = finalUrl;

            document.getElementById('status').textContent = `▶ ${name} oynanıyor...`;
            document.getElementById('status').style.color = '#6af';

            // Sayfa başlığını güncelle
            document.title = `🎮 ${name} - TLauncher`;

            // Scroll yukarı
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function openTLauncher() {
            playGame('https://tlauncher.org', 'TLauncher');
        }

        function closeIframe() {
            document.getElementById('iframeContainer').classList.remove('show');
            document.getElementById('gameIframe').src = '';
            document.getElementById('status').textContent = '✅ Oyun kapatıldı';
            document.getElementById('status').style.color = '#555';
            document.title = '🎮 200+ Oyun Başlatıcı - TLauncher';
        }

        // ================================================================
        //  FİLTRELEME
        // ================================================================
        function filterGames() {
            currentSearch = document.getElementById('searchInput').value;
            renderGames();
        }

        document.querySelectorAll('.categories button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.cat;
                renderGames();
            });
        });

        // ================================================================
        //  BAŞLAT
        // ================================================================
        renderGames();

        console.log(`✅ ${allGames.length} oyun yüklendi!`);
    </script>

</body>
</html>
